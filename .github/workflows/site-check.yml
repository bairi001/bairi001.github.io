name: Site checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check static site
        run: node scripts/check-site.mjs
      - name: Check prices
        run: node scripts/check-prices.mjs
      - name: Check SEO consistency
        run: node scripts/check-seo.mjs
      - name: Check final freeze guards
        run: node scripts/check-final-freeze.mjs
      - name: Check menu image semantics
        run: node scripts/check-menu-images.mjs
      - name: Check Smart Booking V2
        run: node scripts/check-booking-v2.mjs
      - name: Check same-room booking request
        run: node scripts/check-same-room.mjs
      - name: Check booking status v5 lifecycle
        run: node scripts/check-booking-status-v5.mjs
      - name: Run Smart Booking V2 in headless Chromium
        run: node scripts/check-booking-runtime.mjs
      - name: Check Recruit Direct Apply V2
        run: node scripts/check-recruit-v2.mjs
      - name: Run Recruit Direct Apply V2 in headless Chromium
        run: node scripts/check-recruit-runtime.mjs

      - name: Install Japanese fonts for P1 visual QA
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Run P1 visual QA
        run: node scripts/qa-p1-73-visual.mjs
      - name: Upload P1 visual QA
        uses: actions/upload-artifact@v4
        with:
          name: p1-73-visual-qa
          path: qa-p1-73/*
          if-no-files-found: error
