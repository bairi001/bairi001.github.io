name: Apply booking deduplication and localized mail

on:
  push:
    branches:
      - agent/booking-dedup-mail-i18n
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/booking-dedup-mail-i18n
          fetch-depth: 0

      - name: Apply scoped changes
        run: python3 .github/scripts/apply_booking_fix.py

      - name: Validate changes
        shell: bash
        run: |
          node scripts/check-site.mjs
          node scripts/check-prices.mjs
          cp docs/google-apps-script/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          git diff --check
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' booking.html docs/google-apps-script/Code.gs | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          grep -F 'submissionId:stableWebSubmissionId()' booking.html
          grep -F 'webSubmissionSucceeded=true' booking.html
          grep -F 'var DUPLICATE_WINDOW_SECONDS = 300;' docs/google-apps-script/Code.gs
          grep -F 'name: "身悠晏 Shin Yuu An"' docs/google-apps-script/Code.gs

      - name: Commit scoped changes
        shell: bash
        run: |
          rm .github/workflows/fix-booking-dedup-mail.yml .github/workflows/retry-booking-fix.yml .github/scripts/apply_booking_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add booking.html docs/google-apps-script/Code.gs .github/workflows/fix-booking-dedup-mail.yml .github/workflows/retry-booking-fix.yml .github/scripts/apply_booking_fix.py
          git commit -m "防止网页预约重复提交并优化通知邮件"
          git push origin HEAD:agent/booking-dedup-mail-i18n
