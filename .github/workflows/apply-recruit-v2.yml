name: Apply Recruit V2 patch

on:
  push:
    branches:
      - feat/recruit-direct-apply-v2
    paths:
      - scripts/apply-recruit-v2.mjs
      - .github/workflows/apply-recruit-v2.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/recruit-direct-apply-v2
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply deterministic Recruit V2 patch
        run: node scripts/apply-recruit-v2.mjs
      - name: Commit patched pages
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recruit.html recruit/contractor.html recruit/full-time.html recruit/part-time.html
          git commit -m "Recruit V2：接入直投运行时与岗位预选"
          git push origin HEAD:feat/recruit-direct-apply-v2
