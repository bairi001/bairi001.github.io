name: One-time SEO optimization

on:
  push:
    branches:
      - feature/recruit-conversion-v2
    paths:
      - '.github/workflows/seo-optimize.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/recruit-conversion-v2
          fetch-depth: 0

      - name: Apply SEO and conversion optimization
        run: python .github/seo_optimize.py

      - name: Sanity checks
        run: |
          python - <<'PY'
          from pathlib import Path
          required = [
              'index.html','en/index.html','menu.html','shop.html','faq.html','recruit.html','sitemap.xml',
              'ashitsubo-fukurahagi.html','kamata-late-night.html','headspa-kamata.html',
              'en/foot-massage-kamata.html','en/late-night-massage-kamata.html','en/haneda-kamata-massage.html',
              'recruit/contractor.html','recruit/full-time.html','recruit/part-time.html'
          ]
          for f in required:
              p=Path(f)
              assert p.exists(), f'missing {f}'
              s=p.read_text(encoding='utf-8')
              if f.endswith('.html'):
                  assert '<title>' in s and '</html>' in s, f'bad html {f}'
          site=Path('sitemap.xml').read_text(encoding='utf-8')
          assert 'https://shinyuuan.jp/booking.html' not in site, 'noindex booking must not be in sitemap'
          assert 'https://shinyuuan.jp/en/foot-massage-kamata.html' in site
          assert 'https://shinyuuan.jp/recruit/contractor.html' in site
          en=Path('en/index.html').read_text(encoding='utf-8')
          assert 'Massage near JR Kamata Station, Tokyo' in en
          assert '10–15 minutes from Haneda' not in en
          hub=Path('recruit.html').read_text(encoding='utf-8')
          assert '"@type":"JobPosting"' not in hub and '"@type": "JobPosting"' not in hub
          for f in ['recruit/contractor.html','recruit/full-time.html','recruit/part-time.html']:
              s=Path(f).read_text(encoding='utf-8')
              assert s.count('JobPosting') == 1, f'expected one JobPosting in {f}'
          print('Sanity checks passed')
          PY

      - name: Commit optimized site
        run: |
          rm -f .github/seo_optimize.py .github/workflows/seo-optimize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Maximize local SEO, English acquisition and recruitment search"
          git push origin HEAD:feature/recruit-conversion-v2
