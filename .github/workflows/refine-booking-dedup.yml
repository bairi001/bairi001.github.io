name: Refine booking deduplication

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/booking-dedup-mail-i18n
          fetch-depth: 0

      - name: Refine mail-failure handling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/google-apps-script/Code.gs')
          code = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global code
              count = code.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              code = code.replace(old, new, 1)

          replace_once(
          '''      var booking = appendBookingRow_(payload, config);
                CacheService.getScriptCache().put(
                  "submission:" + payload.submissionId,
                  "1",
                  SUBMISSION_CACHE_SECONDS
                );
                rememberBooking_(payload);

                var mailStatus = sendBookingMail_(payload, config);
                booking.sheet.getRange(booking.row, 17, 1, 2).setValues([[
                  mailStatus,
                  mailStatus === "sent" ? "recorded_mail_sent" : "recorded_mail_failed"
                ]]);

                return jsonResponse_({ ok: true });''',
          '''      var booking = appendBookingRow_(payload, config);
                var mailStatus = sendBookingMail_(payload, config);
                booking.sheet.getRange(booking.row, 17, 1, 2).setValues([[
                  mailStatus,
                  mailStatus === "sent" ? "recorded_mail_sent" : "recorded_mail_failed"
                ]]);
                if (mailStatus === "sent") {
                  CacheService.getScriptCache().put(
                    "submission:" + payload.submissionId,
                    "1",
                    SUBMISSION_CACHE_SECONDS
                  );
                  rememberBooking_(payload);
                }

                return jsonResponse_({ ok: true });''',
          'move duplicate cache after successful mail')

          start = code.index('function isDuplicateSubmission_(submissionId, sheetId) {')
          end = code.index('\n\nfunction normalizeBookingKey_', start)
          replacement = '''function isDuplicateSubmission_(submissionId, sheetId) {
            if (CacheService.getScriptCache().get("submission:" + submissionId) === "1") return true;
            var sheet = SpreadsheetApp.openById(sheetId).getSheets()[0];
            if (sheet.getLastRow() < 2) return false;
            var matches = sheet
              .getRange(2, 1, sheet.getLastRow() - 1, 1)
              .createTextFinder(submissionId)
              .matchEntireCell(true)
              .findAll();
            for (var index = 0; index < matches.length; index++) {
              if (isHandledMailStatus_(sheet.getRange(matches[index].getRow(), 17).getValue())) return true;
            }
            return false;
          }'''
          code = code[:start] + replacement + code[end:]

          replace_once(
          '''function normalizeBookingKey_(value) {
            return String(value == null ? "" : value).trim().toLowerCase().replace(/\\s+/g, " ");
          }''',
          '''function normalizeBookingKey_(value) {
            return String(value == null ? "" : value).trim().toLowerCase().replace(/\\s+/g, " ");
          }

          function isHandledMailStatus_(value) {
            var status = normalizeBookingKey_(value);
            return status === "sent" || status === "pending";
          }''',
          'insert mail status helper')

          replace_once(
          'var rows = sheet.getRange(startRow, 1, lastRow - startRow + 1, 10).getValues();',
          'var rows = sheet.getRange(startRow, 1, lastRow - startRow + 1, 18).getValues();',
          'read mail status for content deduplication')
          replace_once(
          'if (bookingRowMatches_(rows[index], payload)) return true;',
          'if (bookingRowMatches_(rows[index], payload) && isHandledMailStatus_(rows[index][16])) return true;',
          'ignore prior failed mail rows')

          path.write_text(code, encoding='utf-8')
          PY

      - name: Validate
        shell: bash
        run: |
          node scripts/check-site.mjs
          node scripts/check-prices.mjs
          cp docs/google-apps-script/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          git diff --check
          grep -F 'function isHandledMailStatus_' docs/google-apps-script/Code.gs
          grep -F 'lastRow - startRow + 1, 18' docs/google-apps-script/Code.gs

      - name: Commit
        shell: bash
        run: |
          rm .github/workflows/refine-booking-dedup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/google-apps-script/Code.gs .github/workflows/refine-booking-dedup.yml
          git commit -m "完善预约去重的邮件失败处理"
          git push origin HEAD:agent/booking-dedup-mail-i18n
