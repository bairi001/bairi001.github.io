name: Apply JP money SEO

on:
  push:
    branches:
      - seo/jp-money-keywords-20260811

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: seo/jp-money-keywords-20260811
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply SEO expansion
        run: node scripts/apply-jp-money-seo.mjs
      - name: Run all site checks
        run: |
          node scripts/check-site.mjs
          node scripts/check-prices.mjs
          node scripts/check-seo.mjs
          node scripts/check-menu-images.mjs
      - name: Commit final changes and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "扩大日文核心搜索词覆盖并新增两张获客页"
            git push origin HEAD:seo/jp-money-keywords-20260811
          fi
