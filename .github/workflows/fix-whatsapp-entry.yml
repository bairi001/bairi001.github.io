name: Fix structured WhatsApp booking entry

on:
  push:
    branches:
      - fix/whatsapp-structured-booking-20260809

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/whatsapp-structured-booking-20260809
          fetch-depth: 0

      - name: Remove direct generic WhatsApp bypasses
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              Path('en/index.html'),
              Path('en/foot-massage-kamata.html'),
              Path('en/haneda-kamata-massage.html'),
              Path('en/late-night-massage-kamata.html'),
          ]

          total = 0
          for path in files:
              text = path.read_text(encoding='utf-8')
              text, count = re.subn(
                  r'href="https://wa\.me/817091659898\?text=[^"]+"\s+target="_blank"\s+rel="noopener"',
                  'href="/booking.html?lang=en#bookingForm"',
                  text,
              )
              total += count

              if path.as_posix() == 'en/index.html':
                  text = text.replace('data-track="hero_whatsapp">WhatsApp</a>', 'data-track="hero_whatsapp">WhatsApp via booking form</a>')
                  text = text.replace('data-track="visitor_whatsapp">Ask availability →</a>', 'data-track="visitor_whatsapp">Open booking form →</a>')
                  text = text.replace('data-track="booking_whatsapp">Send request on WhatsApp</a>', 'data-track="booking_whatsapp">Prepare WhatsApp request</a>')
                  text = text.replace('data-track="mobile_whatsapp">WhatsApp</a>', 'data-track="mobile_whatsapp">WhatsApp booking</a>')
              else:
                  text = text.replace('>WhatsApp</a>', '>WhatsApp via booking form</a>')

              path.write_text(text, encoding='utf-8')

          if total != 7:
              raise SystemExit(f'Expected exactly 7 direct WhatsApp bypass links, found {total}')

          for path in files:
              text = path.read_text(encoding='utf-8')
              if 'wa.me/817091659898?text=' in text:
                  raise SystemExit(f'{path}: direct generic WhatsApp link still exists')

          # Core booking page and booking scripts are intentionally untouched.
          for locked in ['booking.html', 'assets/booking-mode.js']:
              if not Path(locked).exists():
                  raise SystemExit(f'LOCK file missing: {locked}')
          PY

      - name: Run repository checks
        shell: bash
        run: |
          node scripts/check-site.mjs
          node scripts/check-prices.mjs
          git diff --check

      - name: Commit scoped fix
        shell: bash
        run: |
          rm .github/workflows/fix-whatsapp-entry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "修复英文WhatsApp入口绕过预约表单"
          git push origin HEAD:fix/whatsapp-structured-booking-20260809
