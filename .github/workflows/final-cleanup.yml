name: One-time final consistency cleanup

on:
  push:
    branches:
      - feature/recruit-conversion-v2
    paths:
      - '.github/workflows/final-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/recruit-conversion-v2
          fetch-depth: 0
      - run: python .github/final_cleanup.py
      - name: Commit cleanup
        run: |
          rm -f .github/final_cleanup.py .github/workflows/final-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align head-care wording across local SEO pages"
          git push origin HEAD:feature/recruit-conversion-v2
