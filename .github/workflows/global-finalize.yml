name: Apply global SEO and visual finalization

on:
  push:
    branches:
      - agent/global-seo-visual-finalize-20260810
    paths:
      - '.global-finalize/READY'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified global fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text(encoding='utf-8')
          def write(path, text): Path(path).write_text(text, encoding='utf-8')
          def must_replace(text, old, new, label, count=1):
              if old not in text:
                  raise SystemExit(f'missing replacement anchor: {label}')
              return text.replace(old, new, count)

          def webp_dimensions(path):
              b=Path(path).read_bytes()
              if len(b)<30 or b[:4]!=b'RIFF' or b[8:12]!=b'WEBP':
                  raise SystemExit(f'bad WebP: {path}')
              pos=12
              while pos+8<=len(b):
                  typ=b[pos:pos+4]; size=int.from_bytes(b[pos+4:pos+8],'little'); data=pos+8
                  if typ==b'VP8X' and data+10<=len(b):
                      return (1+int.from_bytes(b[data+4:data+7],'little'),1+int.from_bytes(b[data+7:data+10],'little'))
                  if typ==b'VP8L' and data+5<=len(b) and b[data]==0x2f:
                      bits=int.from_bytes(b[data+1:data+5],'little'); return ((bits&0x3fff)+1,((bits>>14)&0x3fff)+1)
                  if typ==b'VP8 ':
                      end=min(data+size,data+64,len(b)-7)
                      for i in range(data,end):
                          if b[i:i+3]==b'\x9d\x01\x2a':
                              return (int.from_bytes(b[i+3:i+5],'little')&0x3fff,int.from_bytes(b[i+5:i+7],'little')&0x3fff)
                  pos=data+size+(size&1)
              raise SystemExit(f'cannot read WebP dimensions: {path}')

          image_meta={
            'body': ('assets/img/premium-seitai.webp','施術着を着たまま肩・背中を丁寧にもみほぐす整体ボディケア'),
            'aroma': ('assets/img/menu-aroma-back.webp','背中をオイルでゆっくり流すアロマリンパ・オイルトリートメント'),
            'head': ('assets/img/head-scalp-care.webp','頭まわりを両手で丁寧にほぐすドライヘッドケア'),
          }
          for key,(path,_) in image_meta.items():
              w,h=webp_dimensions(path)
              if w<1200 or h<800: raise SystemExit(f'{path} too small: {w}x{h}')
              image_meta[key]=(path,image_meta[key][1],w,h)
              print(key,path,w,h,Path(path).stat().st_size)

          def replace_section_image(html, section_id, path, alt, w, h):
              pat=re.compile(rf'(<section\b[^>]*id=["\']{re.escape(section_id)}["\'][^>]*>[\s\S]*?<div\s+class=["\']menu-photo["\']>)[\s\S]*?(</div>)',re.I)
              m=pat.search(html)
              if not m: raise SystemExit(f'menu section image anchor missing: {section_id}')
              prefix=m.group(1)
              # Preserve only the menu-photo wrapper; replace its contents exactly.
              new=f'{prefix}<img src="{path}" alt="{alt}" loading="lazy" width="{w}" height="{h}">{m.group(2)}'
              return html[:m.start()]+new+html[m.end():]

          # menu.html — actual source-of-truth image mapping, clarity and mobile conversion consistency.
          p='menu.html'; s=read(p)
          s=replace_section_image(s,'bodycare',*image_meta['body'])
          s=replace_section_image(s,'aroma',*image_meta['aroma'])
          s=replace_section_image(s,'head',*image_meta['head'])
          s=must_replace(s,'<meta property="og:image" content="https://shinyuuan.jp/assets/img/shop-front.jpg">','<meta property="og:image" content="https://shinyuuan.jp/assets/img/premium-seitai.webp">','menu og image')
          style_anchor='.menu-web-cta{text-align:center;margin-top:22px}'
          s=must_replace(s,style_anchor,style_anchor+'.menu-photo img{filter:none!important}','menu image natural filter')
          mobile='<div class="mobile-fixed-cta" aria-label="固定予約ボタン"><a href="https://beauty.hotpepper.jp/kr/slnH000397723/" target="_blank" rel="noopener" data-channel="hpb">HotPepper予約</a><a href="/booking.html?lang=ja" data-channel="web">ウェブ予約</a><a href="https://page.line.me/017hlpiu" target="_blank" rel="noopener" data-channel="line">LINE相談</a></div>'
          s,n=re.subn(r'<div class="mobile-fixed-cta"[^>]*>[\s\S]*?</div>',mobile,s,count=1)
          if n!=1: raise SystemExit('menu mobile CTA anchor missing')
          write(p,s)

          # Homepage — keep HERO locked; align only service cards with actual treatment categories.
          p='index.html'; s=read(p)
          body_path,body_alt,bw,bh=image_meta['body']; aroma_path,aroma_alt,aw,ah=image_meta['aroma']
          body_pat=re.compile(r'(<article class="service-card">\s*)<img\b[^>]*>([\s\S]*?<div class="service-card-num">Service 02</div>\s*<h3>整体ボディケア</h3>)')
          s,n=body_pat.subn(rf'\1<img src="{body_path}" alt="{body_alt}" loading="lazy" width="{bw}" height="{bh}">\2',s,count=1)
          if n!=1: raise SystemExit('home Service 02 anchor missing')
          aroma_pat=re.compile(r'(<article class="service-card">\s*)<img\b[^>]*>([\s\S]*?<div class="service-card-num">Service 03</div>\s*<h3>)([^<]+)(</h3>\s*<p>)([^<]+)(</p>)')
          repl=rf'\1<img src="{aroma_path}" alt="{aroma_alt}" loading="lazy" width="{aw}" height="{ah}">\2アロマリンパ・オイル\4香りに包まれながら、背中や脚などをオイルでゆっくりケア。全身をゆったり受けたい日におすすめです。\6'
          s,n=aroma_pat.subn(repl,s,count=1)
          if n!=1: raise SystemExit('home Service 03 anchor missing')
          write(p,s)

          # Shop / FAQ — same Japanese mobile conversion strategy as homepage.
          for p in ['shop.html','faq.html']:
              s=read(p)
              s,n=re.subn(r'<div class="mobile-fixed-cta"[^>]*>[\s\S]*?</div>',mobile,s,count=1)
              if n!=1: raise SystemExit(f'{p} mobile CTA anchor missing')
              write(p,s)

          # Head intent page — visible hero and social preview must match head-care intent.
          p='headspa-kamata.html'; s=read(p)
          head_path,head_alt,hw,hh=image_meta['head']
          s=must_replace(s,'<meta property="og:image" content="https://shinyuuan.jp/assets/img/shop-room.jpg">',f'<meta property="og:image" content="https://shinyuuan.jp/{head_path}">','headspa og image')
          s,n=re.subn(r'<img src="/assets/img/shop-room\.jpg" alt="身悠晏の落ち着いた施術スペース" fetchpriority="high">',f'<img src="/{head_path}" alt="蒲田の身悠晏で行う髪を濡らさないドライヘッドケア" fetchpriority="high" width="{hw}" height="{hh}">',s,count=1)
          if n!=1: raise SystemExit('headspa hero anchor missing')
          write(p,s)

          # LocalBusiness entity images — representative service imagery, while retaining storefront first.
          representative='["https://shinyuuan.jp/assets/img/shop-front.jpg","https://shinyuuan.jp/assets/img/premium-seitai.webp","https://shinyuuan.jp/assets/img/menu-aroma-back.webp","https://shinyuuan.jp/assets/img/menu-foot-close.webp","https://shinyuuan.jp/assets/img/head-scalp-care.webp"]'
          for p in ['index.html','shop.html','en/index.html']:
              s=read(p)
              old='"image":"https://shinyuuan.jp/assets/img/shop-front.jpg"'
              if old not in s: raise SystemExit(f'{p} LocalBusiness image anchor missing')
              s=s.replace(old,f'"image":{representative}',1)
              write(p,s)

          # Booking raw source truth — remove stale daily/private-room claims and selected-time fee calculation.
          p='booking.html'; s=read(p)
          replacements=[
            ('trustHours:"Open daily"','trustHours:"Hours"'),
            ('trustHoursSub:"11:00 AM – 2:00 AM (next day)"','trustHoursSub:"11:00 AM – 2:00 AM · Closed January 1"'),
            ('trustSpace:"Private room space · Female friendly"','trustSpace:"Private treatment space · curtain entrance"'),
            ('formLead:"Complete the form and send it via WhatsApp. We will check availability and reply to confirm your appointment."','formLead:"Choose your course and preferred time, then send your request on this website or via WhatsApp. We will check availability and reply to confirm your appointment."'),
            ('hoursHint:"Open daily 11:00 AM – 2:00 AM. Last booking request 1:00 AM. Late-night fee ¥800 after 11:00 PM."','hoursHint:"Hours: 11:00 AM–2:00 AM (closed January 1). Last booking request 1:00 AM. An ¥800 late-night fee applies when you arrive at or after 11:00 PM. All times are JST."'),
            ('estimateSingle:n=>`Estimated price for 1 guest: ¥${n.toLocaleString()}${isLate()?" (including the ¥800 late-night fee)":""}. Final price is confirmed by the salon.`','estimateSingle:n=>`Estimated price for 1 guest: ¥${n.toLocaleString()}. An ¥800 late-night fee applies only if you arrive at or after 11:00 PM. Final price is confirmed by the salon.`'),
            ('estimateGroup:n=>`Listed amount per guest: ¥${n.toLocaleString()}${isLate()?" + ¥800 late-night fee":""}. We will confirm the group total.`','estimateGroup:n=>`Listed amount per guest: ¥${n.toLocaleString()}. An ¥800 late-night fee applies per guest only if arrival is at or after 11:00 PM. We will confirm the group total.`'),
            ('trustHours:"每天营业"','trustHours:"营业时间"'),
            ('trustHoursSub:"11:00－次日凌晨2:00"','trustHoursSub:"11:00－次日2:00 · 1月1日休息"'),
            ('formLead:"填写后通过WhatsApp发送预约申请。我们确认空位后会回复，收到回复后预约才正式成立。"','formLead:"选择套餐和希望时间后，可通过本网页或WhatsApp发送预约申请。收到店铺回复后，预约才正式成立。"'),
            ('hoursHint:"每天11:00－次日凌晨2:00营业，最晚预约申请时间为凌晨1:00。23:00以后加收深夜费¥800。"','hoursHint:"营业时间11:00～次日2:00（1月1日休息），最晚预约申请为次日1:00。若实际到店时间为23:00或之后，每位加收800日元深夜费；以实际到店时间为准。所有时间均为日本标准时间（JST）。"'),
            ('estimateSingle:n=>`1位客人预估价格：¥${n.toLocaleString()}${isLate()?"（已包含深夜费¥800）":""}。最终价格由店铺回复确认。`','estimateSingle:n=>`1位客人所选项目预估价格：¥${n.toLocaleString()}。若实际到店时间为23:00或之后，另加深夜费¥800。最终价格由店铺回复确认。`'),
            ('estimateGroup:n=>`每位客人所选项目价格：¥${n.toLocaleString()}${isLate()?"，另加深夜费¥800":""}。团体总价将在回复时确认。`','estimateGroup:n=>`每位客人所选项目价格：¥${n.toLocaleString()}。若实际到店时间为23:00或之后，每位另加深夜费¥800。团体总价将在回复时确认。`'),
            ('trustHours:"毎日営業"','trustHours:"営業時間"'),
            ('trustHoursSub:"11:00〜翌2:00"','trustHoursSub:"11:00〜翌2:00 · 1月1日休み"'),
            ('trustSpace:"個室空間 · 女性も通いやすい"','trustSpace:"落ち着ける施術スペース · 入口カーテン"'),
            ('formLead:"フォーム入力後、WhatsAppで予約リクエストを送信します。空き状況を確認し、当店からの返信をもって予約確定となります。"','formLead:"コースと希望日時を入力し、ウェブまたはWhatsAppから予約リクエストを送信できます。空き状況を確認後、当店からの返信をもって予約確定となります。"'),
            ('hoursHint:"毎日11:00〜翌2:00営業、最終予約リクエストは翌1:00です。23時以降は深夜料金800円。"','hoursHint:"営業時間11:00〜翌2:00（1月1日休み）。最終予約リクエストは翌1:00です。実際のご来店が23:00以降の場合、深夜料金800円。予約時刻ではなく実際のご来店時刻が基準です。"'),
            ('estimateSingle:n=>`1名様の概算料金：¥${n.toLocaleString()}${isLate()?"（深夜料金800円を含む）":""}。最終料金は当店からの返信でご確認ください。`','estimateSingle:n=>`1名様の選択料金：¥${n.toLocaleString()}。実際のご来店が23:00以降の場合は深夜料金800円が加算されます。最終料金は当店からの返信でご確認ください。`'),
            ('estimateGroup:n=>`1名様あたりの選択料金：¥${n.toLocaleString()}${isLate()?"＋深夜料金800円":""}。合計は返信時に確認いたします。`','estimateGroup:n=>`1名様あたりの選択料金：¥${n.toLocaleString()}。実際のご来店が23:00以降の場合は1名様につき深夜料金800円が加算されます。合計は返信時に確認いたします。`'),
            ('trustHours:"매일 영업"','trustHours:"영업시간"'),
            ('trustHoursSub:"11:00－다음 날 2:00"','trustHoursSub:"11:00－다음 날 2:00 · 1월 1일 휴무"'),
            ('hoursHint:"매일 11:00－다음 날 2:00 영업, 마지막 예약 신청은 다음 날 1:00입니다. 23:00 이후에는 심야 요금 ¥800이 추가됩니다. 모든 시간은 일본 표준시(JST)입니다."','hoursHint:"영업시간은 11:00~다음 날 2:00이며 1월 1일은 휴무입니다. 마지막 예약 신청은 다음 날 1:00입니다. 실제 도착 시간이 23:00 이후인 경우 1인당 심야 요금 800엔이 추가되며, 예약 시간이 아닌 실제 도착 시간을 기준으로 합니다. 모든 시간은 일본 표준시(JST)입니다."'),
          ]
          for old,new in replacements:
              s=must_replace(s,old,new,f'booking: {old[:35]}')
          # Korean formLead may already be close enough, but harden it to web + WhatsApp if exact old form exists.
          old='formLead:"양식을 작성한 뒤 WhatsApp으로 예약 신청을 보내 주세요. 매장에서 가능 여부를 확인해 답변드리며, 답변을 받은 뒤 예약이 확정됩니다."'
          if old in s:
              s=s.replace(old,'formLead:"코스와 희망 시간을 입력한 뒤 웹페이지 또는 WhatsApp으로 예약 신청을 보낼 수 있습니다. 매장의 답변을 받은 뒤 예약이 확정됩니다."',1)
          # Remove selected-booking-time late-fee calculation from price and generated WhatsApp request.
          s,n=re.subn(r'const isLate=\(\)=>\{const value=\$\("time"\)\.value;return value\?Number\(value\.split\("\\\|"\)\[0\]\)>=1380:false\};\n','',s,count=1)
          if n!=1: raise SystemExit('booking isLate helper anchor missing')
          old='return course.price+selectedAddons().reduce((sum,item)=>sum+item.price,0)+selectedNomination().price+(isLate()?800:0);'
          s=must_replace(s,old,'return course.price+selectedAddons().reduce((sum,item)=>sum+item.price,0)+selectedNomination().price;','booking currentPrice selected-time fee')
          old='  if(isLate())lines.push(`■ ${labels.fee}: ¥800`);\n'
          s=must_replace(s,old,'','booking WhatsApp selected-time fee')
          if 'isLate()' in s: raise SystemExit('booking selected-time isLate dependency still remains')
          write(p,s)

          # Price guard — stop locking the incorrect selected-booking-time late fee.
          p='scripts/check-prices.mjs'; s=read(p)
          old='expect("booking.html", "Late-night start time mismatch", />=1380:false/);\nexpect("booking.html", "Late-night fee mismatch", new RegExp(`isLate\\\\(\\\\)\\\\?${prices.lateNightFee.price}:0`));'
          new='if (/isLate\\(\\)/.test(files["booking.html"]) || /selected booking time/i.test(files["booking.html"])) errors.push("booking.html: selected booking time must not trigger the late-night fee");\nexpect("booking.html", "Arrival-based late-night rule missing", /予約時刻ではなく実際のご来店時刻が基準です/);'
          s=must_replace(s,old,new,'price guard late-night basis')
          write(p,s)

          # SEO guard — approved menu assets, static mobile CTA on all Japanese conversion pages, truthful raw booking and entity imagery.
          p='scripts/check-seo.mjs'; s=read(p)
          old='for (const image of ["body-shoulder-care-new.webp", "aroma-leg-care-new.webp", "leg-option-care-new.webp", "decollete-care-new.webp"]) {\n  if (!menu.includes(image)) fail("menu.html", `new treatment image is not statically referenced: ${image}`);\n}'
          new='for (const image of ["premium-seitai.webp", "menu-aroma-back.webp", "head-scalp-care.webp", "leg-option-care-new.webp", "decollete-care-new.webp"]) {\n  if (!menu.includes(image)) fail("menu.html", `approved treatment image is not statically referenced: ${image}`);\n}'
          s=must_replace(s,old,new,'seo approved menu images')
          old='  "index.html": [\'data-channel="hpb">HotPepper予約\', \'data-channel="web">ウェブ予約\', \'data-channel="line">LINE相談\'],'
          new='  "index.html": [\'data-channel="hpb">HotPepper予約\', \'data-channel="web">ウェブ予約\', \'data-channel="line">LINE相談\'],\n  "menu.html": [\'data-channel="hpb">HotPepper予約\', \'data-channel="web">ウェブ予約\', \'data-channel="line">LINE相談\'],\n  "shop.html": [\'data-channel="hpb">HotPepper予約\', \'data-channel="web">ウェブ予約\', \'data-channel="line">LINE相談\'],\n  "faq.html": [\'data-channel="hpb">HotPepper予約\', \'data-channel="web">ウェブ予約\', \'data-channel="line">LINE相談\'],'
          s=must_replace(s,old,new,'seo Japanese static CTA coverage')
          insertion='''\nfor (const phrase of ["Open daily","毎日営業","每天营业","매일 영업","Private room space","個室空間"]) {\n  if (booking.includes(phrase)) fail("booking.html", `stale raw booking claim remains: ${phrase}`);\n}\nfor (const phrase of ["予約時刻ではなく実際のご来店時刻が基準です","arrive at or after 11:00 PM","1月1日休み","入口カーテン"]) {\n  if (!booking.includes(phrase)) fail("booking.html", `truthful raw booking wording missing: ${phrase}`);\n}\nif (booking.includes("isLate()")) fail("booking.html", "selected booking time must not calculate or append the late-night fee");\nfor (const file of ["index.html","shop.html","en/index.html"]) {\n  const html=indexableHtml[file];\n  for (const image of ["shop-front.jpg","premium-seitai.webp","menu-aroma-back.webp","menu-foot-close.webp","head-scalp-care.webp"]) {\n    if (!html.includes(image)) fail(file, `LocalBusiness representative image missing: ${image}`);\n  }\n}\nconst legacyCloseout = await read("assets/site-closeout.js");\nfor (const stale of ["body-shoulder-care-new.webp","aroma-leg-care-new.webp","Open daily","Private room space","patchMenu","patchFaq"]) {\n  if (legacyCloseout.includes(stale)) fail("assets/site-closeout.js", `legacy compatibility shim still contains stale DOM patch: ${stale}`);\n}\n'''
          anchor='for (const required of ["labels.course", "labels.date", "labels.time", "labels.guests", "labels.name", "via shinyuuan.jp/booking.html"]) {\n  if (!booking.includes(required)) fail("booking.html", `structured WhatsApp message field missing: ${required}`);\n}\n'
          if anchor not in s: raise SystemExit('seo booking guard insertion anchor missing')
          s=s.replace(anchor,anchor+insertion,1)
          write(p,s)

          # Replace the image checker with one that validates actual file pixels AND rendered mapping.
          check=r'''import { readFile, stat } from "node:fs/promises";
import path from "node:path";
import process from "node:process";
const root=path.resolve(new URL("../",import.meta.url).pathname.replace(/^\/([A-Za-z]:)/,"$1"));
const errors=[]; const fail=m=>errors.push(m);
const text=async p=>readFile(path.join(root,p),"utf8"); const bin=async p=>readFile(path.join(root,p));
function section(html,id){return html.match(new RegExp(`<section\\b[^>]*id=["']${id}["'][\\s\\S]*?<\\/section>`,"i"))?.[0]||""}
function dims(b){if(b.length<30||b.toString("ascii",0,4)!=="RIFF"||b.toString("ascii",8,12)!=="WEBP")throw new Error("invalid WebP header");let p=12;while(p+8<=b.length){const t=b.toString("ascii",p,p+4),n=b.readUInt32LE(p+4),d=p+8;if(t==="VP8X")return[1+b.readUIntLE(d+4,3),1+b.readUIntLE(d+7,3)];if(t==="VP8L"&&b[d]===0x2f){const x=b.readUInt32LE(d+1);return[(x&0x3fff)+1,((x>>14)&0x3fff)+1]}if(t==="VP8 "){for(let i=d;i<Math.min(d+n,d+64,b.length-7);i++)if(b[i]===0x9d&&b[i+1]===1&&b[i+2]===0x2a)return[b.readUInt16LE(i+3)&0x3fff,b.readUInt16LE(i+5)&0x3fff]}p=d+n+(n&1)}throw new Error("cannot determine WebP dimensions")}
const menu=await text("menu.html");
const locks={bodycare:{file:"assets/img/premium-seitai.webp",alt:"施術着を着たまま肩・背中を丁寧にもみほぐす整体ボディケア",forbidden:["body-shoulder-care-new.webp","booking-treatment-waterwood-4k.webp"]},aroma:{file:"assets/img/menu-aroma-back.webp",alt:"背中をオイルでゆっくり流すアロマリンパ・オイルトリートメント",forbidden:["aroma-leg-care-new.webp","leg-option-care-new.webp"]},head:{file:"assets/img/head-scalp-care.webp",alt:"頭まわりを両手で丁寧にほぐすドライヘッドケア",forbidden:["decollete-care.webp","decollete-care-new.webp"]}};
