name: Apply final freeze fixes

on:
  push:
    branches:
      - agent/final-freeze-audit-20260811
    paths:
      - scripts/final-freeze-fix.mjs
      - .github/workflows/final-freeze-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-freeze-audit-20260811
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply audited changes
        run: node scripts/final-freeze-fix.mjs
      - name: Run full site checks
        run: |
          node scripts/check-site.mjs
          node scripts/check-prices.mjs
          node scripts/check-seo.mjs
          node scripts/check-menu-images.mjs
      - name: Commit audited changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu.html bodycare-kamata.html kamata-late-night.html recruit.html recruit/contractor.html recruit/full-time.html recruit/part-time.html sitemap.xml scripts/check-seo.mjs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "终局审查：收紧关键词分工、内链与招聘结构化数据"
          git push origin HEAD:agent/final-freeze-audit-20260811
# trigger: 2026-08-11 final audit
