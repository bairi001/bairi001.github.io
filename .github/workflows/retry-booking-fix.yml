name: Retry booking deduplication fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/booking-dedup-mail-i18n
          fetch-depth: 0

      - name: Run corrected transformation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/fix-booking-dedup-mail.yml').read_text(encoding='utf-8')
          marker_start = "          python3 - <<'PY'\n"
          marker_end = "\n          PY\n\n      - name: Validate changes"
          if marker_start not in workflow or marker_end not in workflow:
              raise SystemExit('Could not extract original transformation script')
          script = workflow.split(marker_start, 1)[1].split(marker_end, 1)[0]
          script = textwrap.dedent(script)

          wrong_old = '''      if (isDuplicateSubmission_(payload.submissionId, config.sheetId)) {
              return jsonResponse_({ ok: true, duplicate: true });
              }
              if (!checkRateLimit_(config.maxPerHour)) {'''
          correct_old = '''      if (isDuplicateSubmission_(payload.submissionId, config.sheetId)) {
        return jsonResponse_({ ok: true, duplicate: true });
      }
      if (!checkRateLimit_(config.maxPerHour)) {'''
          wrong_new = '''      if (isDuplicateSubmission_(payload.submissionId, config.sheetId)) {
              return jsonResponse_({ ok: true, duplicate: true });
              }
              if (isDuplicateBooking_(payload, config)) {
                return jsonResponse_({ ok: true, duplicate: true });
              }
              if (!checkRateLimit_(config.maxPerHour)) {'''
          correct_new = '''      if (isDuplicateSubmission_(payload.submissionId, config.sheetId)) {
        return jsonResponse_({ ok: true, duplicate: true });
      }
      if (isDuplicateBooking_(payload, config)) {
        return jsonResponse_({ ok: true, duplicate: true });
      }
      if (!checkRateLimit_(config.maxPerHour)) {'''
          wrong_remember_old = '''      CacheService.getScriptCache().put(
              "submission:" + payload.submissionId,
              "1",
              SUBMISSION_CACHE_SECONDS
              );

              var mailStatus = sendBookingMail_(payload, config);'''
          correct_remember_old = '''      CacheService.getScriptCache().put(
        "submission:" + payload.submissionId,
        "1",
        SUBMISSION_CACHE_SECONDS
      );

      var mailStatus = sendBookingMail_(payload, config);'''
          wrong_remember_new = '''      CacheService.getScriptCache().put(
              "submission:" + payload.submissionId,
              "1",
              SUBMISSION_CACHE_SECONDS
              );
              rememberBooking_(payload);

              var mailStatus = sendBookingMail_(payload, config);'''
          correct_remember_new = '''      CacheService.getScriptCache().put(
        "submission:" + payload.submissionId,
        "1",
        SUBMISSION_CACHE_SECONDS
      );
      rememberBooking_(payload);

      var mailStatus = sendBookingMail_(payload, config);'''

          for old, new, label in [
              (wrong_old, correct_old, 'duplicate old block'),
              (wrong_new, correct_new, 'duplicate new block'),
              (wrong_remember_old, correct_remember_old, 'remember old block'),
              (wrong_remember_new, correct_remember_new, 'remember new block')
          ]:
              if old not in script:
                  raise SystemExit(f'Patch source missing: {label}')
              script = script.replace(old, new, 1)

          exec(compile(script, '<booking-fix>', 'exec'), {})
          PY

      - name: Validate changes
        shell: bash
        run: |
          node scripts/check-site.mjs
          node scripts/check-prices.mjs
          cp docs/google-apps-script/Code.gs /tmp/Code.js
          node --check /tmp/Code.js
          git diff --check
          git diff --name-only | sort > /tmp/changed.txt
          printf '%s\n' booking.html docs/google-apps-script/Code.gs | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
          grep -F 'submissionId:stableWebSubmissionId()' booking.html
          grep -F 'webSubmissionSucceeded=true' booking.html
          grep -F 'var DUPLICATE_WINDOW_SECONDS = 300;' docs/google-apps-script/Code.gs
          grep -F 'name: "身悠晏 Shin Yuu An"' docs/google-apps-script/Code.gs

      - name: Commit scoped changes
        shell: bash
        run: |
          rm .github/workflows/fix-booking-dedup-mail.yml .github/workflows/retry-booking-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add booking.html docs/google-apps-script/Code.gs .github/workflows/fix-booking-dedup-mail.yml .github/workflows/retry-booking-fix.yml
          git commit -m "防止网页预约重复提交并优化通知邮件"
          git push origin HEAD:agent/booking-dedup-mail-i18n
