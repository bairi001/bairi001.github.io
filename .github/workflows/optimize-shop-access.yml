name: Optimize shop access image

on:
  pull_request:
    paths:
      - ".github/workflows/optimize-shop-access.yml"
      - "assets/img/shop-access.jpg"

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Install ImageMagick
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick

      - name: Optimize mislabeled PNG to real JPEG
        shell: bash
        run: |
          set -euo pipefail
          file assets/img/shop-access.jpg
          before=$(stat -c%s assets/img/shop-access.jpg)
          dimensions=$(identify -format '%wx%h' assets/img/shop-access.jpg)
          format=$(identify -format '%m' assets/img/shop-access.jpg)
          echo "before_bytes=$before format=$format dimensions=$dimensions"

          test "$dimensions" = "2390x1792"

          if [ "$before" -gt 2000000 ]; then
            convert assets/img/shop-access.jpg \
              -background white -alpha remove -alpha off \
              -strip -interlace Plane -sampling-factor 4:2:0 -quality 88 \
              /tmp/shop-access.jpg

            after=$(stat -c%s /tmp/shop-access.jpg)
            out_dimensions=$(identify -format '%wx%h' /tmp/shop-access.jpg)
            out_format=$(identify -format '%m' /tmp/shop-access.jpg)
            echo "after_bytes=$after format=$out_format dimensions=$out_dimensions"

            test "$out_format" = "JPEG"
            test "$out_dimensions" = "2390x1792"
            test "$after" -lt 1500000

            mv /tmp/shop-access.jpg assets/img/shop-access.jpg
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/img/shop-access.jpg
            git commit -m "Performance: compress shop access image"
            git push origin HEAD:${{ github.head_ref }}
          else
            echo "Image already below 2 MB; no optimization commit needed."
          fi
