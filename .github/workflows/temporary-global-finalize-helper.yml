name: Temporary global finalize helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/global-seo-visual-finalize-20260810'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/global-seo-visual-finalize-20260810
          fetch-depth: 0
      - name: Fix homepage service cards exactly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          rules={
            '01':('assets/img/premium-foot.webp','足裏の反射区を親指で丁寧に押すリフレクソロジー','1254','1050'),
            '02':('assets/img/premium-seitai.webp','施術着を着たまま肩・背中を丁寧にもみほぐす整体ボディケア','1254','1050'),
            '03':('assets/img/menu-aroma-back.webp','背中をオイルでゆっくり流すアロマリンパ・オイルトリートメント','1800','1005'),
          }
          for num,(src,alt,w,h) in rules.items():
              pat=re.compile(r'(<article class="service-card">\s*)<img\b[^>]*>([\s\S]*?<div class="service-card-num">Service '+num+r'</div>[\s\S]*?</article>)')
              s,n=pat.subn(rf'\1<img src="{src}" alt="{alt}" loading="lazy" width="{w}" height="{h}">\2',s,count=1)
              if n!=1:
                  raise SystemExit(f'homepage Service {num} exact card replacement failed')
          p.write_text(s,encoding='utf-8')

          p=Path('scripts/check-menu-images.mjs')
          c=p.read_text(encoding='utf-8')
          marker='const head=await text("headspa-kamata.html");'
          strict='''function serviceCard(html,num){return html.match(new RegExp(`<article class="service-card">[\\s\\S]*?<div class="service-card-num">Service ${num}</div>[\\s\\S]*?</article>`,"i"))?.[0]||""}\nconst serviceLocks={"01":"premium-foot.webp","02":"premium-seitai.webp","03":"menu-aroma-back.webp"};\nfor(const[num,image]of Object.entries(serviceLocks)){const card=serviceCard(home,num);if(!card)fail(`home Service ${num} card missing`);else if(!card.includes(image))fail(`home Service ${num} must use ${image}`);}\n'''
          if 'const serviceLocks=' not in c:
              if marker not in c: raise SystemExit('image checker insertion anchor missing')
              c=c.replace(marker,strict+marker,1)
          # Remove earlier broad homepage checks that can pass when images are on the wrong card.
          c=re.sub(r'if\(!home\.includes\("premium-seitai\.webp"\).*?fail\("home body-care service photo mapping missing"\);','',c)
          c=re.sub(r'if\(!home\.includes\("menu-aroma-back\.webp"\).*?fail\("home aroma service mapping missing"\);','',c)
          p.write_text(c,encoding='utf-8')
          PY
      - name: Validate static site
        run: node scripts/check-site.mjs
      - name: Validate prices and arrival-based late fee
        run: node scripts/check-prices.mjs
      - name: Validate SEO consistency
        run: node scripts/check-seo.mjs
      - name: Validate exact image semantics and quality
        run: node scripts/check-menu-images.mjs
      - name: Commit verified branch changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/check-menu-images.mjs
          if git diff --cached --quiet; then
            echo 'No branch changes to commit.'
            exit 0
          fi
          git commit -m '精确锁定首页三项服务图片语义'
          git push origin HEAD:agent/global-seo-visual-finalize-20260810
