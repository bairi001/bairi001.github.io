name: Temporary global finalize helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/global-seo-visual-finalize-20260810'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/global-seo-visual-finalize-20260810
          fetch-depth: 0
      - name: Fix homepage service cards exactly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          rules={
            '01':('assets/img/premium-foot.webp','足裏の反射区を親指で丁寧に押すリフレクソロジー','1254','1050'),
            '02':('assets/img/premium-seitai.webp','施術着を着たまま肩・背中を丁寧にもみほぐす整体ボディケア','1254','1050'),
            '03':('assets/img/menu-aroma-back.webp','背中をオイルでゆっくり流すアロマリンパ・オイルトリートメント','1800','1005'),
          }
          for num,(src,alt,w,h) in rules.items():
              marker=f'<div class="service-card-num">Service {num}</div>'
              pos=s.find(marker)
              if pos<0: raise SystemExit(f'homepage Service {num} marker missing')
              start=s.rfind('<article class="service-card">',0,pos)
              end=s.find('</article>',pos)
              if start<0 or end<0: raise SystemExit(f'homepage Service {num} article boundary missing')
              block=s[start:end+10]
              block2,n=re.subn(r'<img\b[^>]*>',f'<img src="{src}" alt="{alt}" loading="lazy" width="{w}" height="{h}">',block,count=1)
              if n!=1: raise SystemExit(f'homepage Service {num} image replacement failed')
              s=s[:start]+block2+s[end+10:]
          p.write_text(s,encoding='utf-8')

          p=Path('scripts/check-menu-images.mjs')
          c=p.read_text(encoding='utf-8')
          # Remove any earlier broad or regex-based service-card guard.
          c=re.sub(r'function serviceCard\(html,num\)\{.*?const serviceLocks=.*?\}\n', '', c, flags=re.S)
          c=re.sub(r'if\(!home\.includes\("premium-seitai\.webp"\).*?;','',c)
          c=re.sub(r'if\(!home\.includes\("menu-aroma-back\.webp"\).*?;','',c)
          marker='const head=await text("headspa-kamata.html");'
          strict='''function serviceCard(html,num){const marker=`<div class="service-card-num">Service ${num}</div>`;const pos=html.indexOf(marker);if(pos<0)return"";const start=html.lastIndexOf('<article class="service-card">',pos);const end=html.indexOf('</article>',pos);return start>=0&&end>=0?html.slice(start,end+10):""}\nconst serviceLocks={"01":"premium-foot.webp","02":"premium-seitai.webp","03":"menu-aroma-back.webp"};\nfor(const[num,image]of Object.entries(serviceLocks)){const card=serviceCard(home,num);if(!card)fail(`home Service ${num} card missing`);else if(!card.includes(image))fail(`home Service ${num} must use ${image}`);}\n'''
          if marker not in c: raise SystemExit('image checker insertion anchor missing')
          c=c.replace(marker,strict+marker,1)
          p.write_text(c,encoding='utf-8')
          PY
      - name: Validate static site
        run: node scripts/check-site.mjs
      - name: Validate prices and arrival-based late fee
        run: node scripts/check-prices.mjs
      - name: Validate SEO consistency
        run: node scripts/check-seo.mjs
      - name: Validate exact image semantics and quality
        run: node scripts/check-menu-images.mjs
      - name: Commit verified branch changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html scripts/check-menu-images.mjs
          if git diff --cached --quiet; then
            echo 'No branch changes to commit.'
            exit 0
          fi
          git commit -m '精确锁定首页三项服务图片语义'
          git push origin HEAD:agent/global-seo-visual-finalize-20260810
