name: Booking mobile preview screenshots (no deploy)
on:
  push:
    branches:
      - preview/booking-mobile-simplify-20261021
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Serve local preview only
        run: |
          python3 -m http.server 18769 --bind 127.0.0.1 > /tmp/preview-server.log 2>&1 &
          sleep 2
          mkdir -p booking-mobile-shots
      - name: Capture mobile viewport (390x844)
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --virtual-time-budget=3000 --screenshot=booking-mobile-shots/01-japanese-one-guest.png "http://127.0.0.1:18769/booking.html?lang=ja&course=body60"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=390,1900 --virtual-time-budget=3000 --screenshot=booking-mobile-shots/02-japanese-two-guests.png "http://127.0.0.1:18769/booking.html?lang=ja&course=body60&guests=2"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=390,844 --virtual-time-budget=3000 --screenshot=booking-mobile-shots/03-chinese-two-guests.png "http://127.0.0.1:18769/booking.html?lang=zh&course=aroma60&guests=2"
          # This visual fixture is generated only in the ephemeral runner; it is never committed or published.
          cat > booking-mobile-showcase.html <<'HTML'
          <!doctype html><html lang="ja"><head><meta charset="utf-8"><title>Booking Preview Two Guests</title>
          <style>html,body{margin:0;padding:0;background:white}iframe{width:390px;height:2100px;border:0;display:block}</style></head>
          <body><iframe id="demo" src="/booking.html?lang=ja&course=body60&guests=2"></iframe>
          <script>
          document.getElementById("demo").addEventListener("load",function(){
            const d=this.contentDocument, w=this.contentWindow;
            const sameRoom=d.getElementById("sameRoom");
            if(!sameRoom)return;
            sameRoom.checked=true;
            sameRoom.dispatchEvent(new w.Event("change",{bubbles:true}));
          });
          </script></body></html>
          HTML
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --window-size=390,1900 --virtual-time-budget=3500 --screenshot=booking-mobile-shots/04-japanese-two-guests-same-room.png "http://127.0.0.1:18769/booking-mobile-showcase.html"
          file booking-mobile-shots/*.png
      - name: Verify 320px/390px layout and no unintended horizontal scrolling
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --window-size=900,850 --virtual-time-budget=7000 --dump-dom "http://127.0.0.1:18769/scripts/fixtures/booking-mobile-width-check.html" > /tmp/booking-mobile-check-output.html
          grep -q 'data-mobile-check="pass"' /tmp/booking-mobile-check-output.html || { grep -o 'data-mobile-details="[^"]*"' /tmp/booking-mobile-check-output.html || true; echo "Mobile width check failed"; exit 1; }
          echo "JA at 320/390 and ZH at 390 pixels: layout width and conditional same-room check passed."
      - name: Upload private review screenshots
        uses: actions/upload-artifact@v4
        with:
          name: booking-mobile-preview-390px
          path: booking-mobile-shots/*.png
          retention-days: 14
