<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><title>Smart Booking V2 runtime harness</title><style>[hidden]{display:none}</style></head>
<body>
<aside class="story"><div class="story-copy"><p data-i18n="storyTitle"></p><p data-i18n="storyLead"></p></div><figure class="story-photo"><img data-alt-key="photoAlt" src="default.webp" alt=""></figure></aside>
<section class="form-side"><div class="form-wrap">
<nav class="language-switch"><button data-lang="ja">日本語</button><button data-lang="en">English</button><button data-lang="zh">中文</button><button data-lang="ko">한국어</button></nav>
<aside id="jaHpbBanner"></aside>
<header class="form-intro"><h1 data-i18n="formTitle"></h1><p data-i18n="formLead"></p></header>
<section class="channel-panel"><h2 data-i18n="channelTitle"></h2><div id="channelActions" class="channel-actions"></div></section>
<form id="bookingForm">
<div class="form-section"><div class="field-control"><select id="course"></select></div></div>
<div class="form-section date-time-grid"><div><input id="date" type="date"></div><div><select id="time"></select></div><p class="hint" data-i18n="hoursHint"></p></div>
<div id="guestButtons"><button type="button" data-guests="1">1</button><button type="button" data-guests="2">2</button><button type="button" data-guests="3">3</button></div>
<details id="extrasSection"><div id="addonsGrid"></div><div id="nominationOptions"></div></details>
<input id="name"><textarea id="note"></textarea>
<div id="webFields"><input id="email" type="email"><input id="phone"><input id="privacyConsent" type="checkbox"></div>
<input id="website"><p data-i18n="preview"></p><div id="preview"></div><div id="estimate"></div><button id="submitButton" type="submit"></button><div id="webSubmitMount"></div><div id="submitStatus"></div>
</form></div></section>
<a id="mapLink"></a><footer><a id="footerPrivacyLink"></a></footer>
<script>
(() => {
  const RealDate = Date;
  const fixed = new RealDate("2026-08-18T00:00:00Z");
  class MockDate extends RealDate {
    constructor(...args) { super(...(args.length ? args : [fixed.getTime()])); }
    static now() { return fixed.getTime(); }
  }
  window.Date = MockDate;
})();
const I18N = {};
for (const language of ["ja", "en", "zh", "ko"]) {
  I18N[language] = {
    channelWeb: "WEB", channelWhatsApp: "WA", channelLine: "LINE", channelHpb: "HPB", channelPhone: "PHONE", webSubmit: "SUBMIT",
    selectCourse: "SELECT COURSE", selectTime: "SELECT TIME", optional: "optional", fillAll: "fill",
    estimateSingle: value => String(value), estimateGroup: value => String(value),
    groups: { popular: "Popular", body: "Body", foot: "Foot", aroma: "Aroma" },
    storyTitle: "story", storyLead: "lead", formTitle: "form", formLead: "formlead", hoursHint: "hours", photoAlt: "photo"
  };
}
let lang = "ja";
let guests = "1";
const WEB_FORM_ENABLED = true;
const COURSE_GROUPS = [
  { key: "popular", items: [{ key: "trial60", price: 4800, ja: "試し", en: "Trial", zh: "体验", ko: "체험" }] },
  { key: "body", items: [{ key: "body30", price: 2400, ja: "整体30", en: "Body30", zh: "身体30", ko: "바디30" }] },
  { key: "foot", items: [{ key: "foot45", price: 3980, ja: "足45", en: "Foot45", zh: "足45", ko: "발45" }] },
  { key: "aroma", items: [
    { key: "aroma30", price: 2980, ja: "アロマ30", en: "Aroma30", zh: "精油30", ko: "아로마30" },
    { key: "aroma60", price: 4980, ja: "アロマ60", en: "Aroma60", zh: "精油60", ko: "아로마60" }
  ] }
];
const ADDONS = [];
const NOMINATIONS = [{ key: "none", price: 0, ja: "なし", en: "none", zh: "无", ko: "없음" }];
const $ = id => document.getElementById(id);
const money = value => `¥${value}`;
const allCourses = () => COURSE_GROUPS.flatMap(group => group.items);
const selectedCourse = () => allCourses().find(item => item.key === $("course").value);
function buildCourses() { $("course").innerHTML = '<option value="">SELECT</option>'; }
function buildTimes() { $("time").innerHTML = '<option value="">TIME</option>'; }
function buildExtras() {}
function buildChannels() {}
function updatePreview() {
  const complete = Boolean(selectedCourse() && $("date").value && $("time").value && $("name").value);
  $("submitButton").disabled = !complete;
  if ($("webSubmitButton")) $("webSubmitButton").disabled = !complete;
}
function applyLanguage(next) {
  lang = next;
  document.querySelectorAll("[data-i18n]").forEach(element => {
    const value = I18N[lang][element.dataset.i18n];
    if (typeof value === "string") element.textContent = value;
  });
  buildCourses(); buildTimes(); buildExtras(); buildChannels(); updatePreview();
}
window.__events = [];
function trackEvent(name, parameters = {}) { window.__events.push({ name, parameters }); }
function messageText() { return "TITLE\n\nCLOSE\n\nvia shinyuuan.jp/booking.html"; }
function webPayload() { return { note: $("note").value }; }
function submitWebForm() { trackEvent("booking_form_start", { channel: "web" }); trackEvent("booking_form_submit_success", { duplicate: false }); }
function showWhatsAppStatus() {}
for (const button of document.querySelectorAll("[data-guests]")) {
  button.addEventListener("click", () => { guests = button.dataset.guests; updatePreview(); });
}
$("bookingForm").addEventListener("input", () => trackEvent("booking_form_start", { channel: "whatsapp" }), { once: true });
$("bookingForm").addEventListener("submit", event => { event.preventDefault(); trackEvent("booking_whatsapp_open", { language: lang }); });
$("date").value = "2026-08-18";
$("date").min = "2026-08-18";
applyLanguage("ja");
</script>
<script src="/assets/booking-mode.js"></script>
<script>
$("name").value = "Runtime Test";
$("name").dispatchEvent(new Event("input", { bubbles: true }));
$("note").value = "Second input";
$("note").dispatchEvent(new Event("input", { bubbles: true }));
trackEvent("booking_form_submit_success", { duplicate: true });
document.documentElement.dataset.testReady = "true";
document.documentElement.dataset.courseOptions = [...$("course").options].map(option => option.textContent).join("|");
document.documentElement.dataset.firstTime = $("time").options[1]?.textContent || "";
document.documentElement.dataset.storyImage = document.querySelector(".story-photo img")?.getAttribute("src") || "";
document.documentElement.dataset.alternative = String(Boolean($("bookingAlternative")));
document.documentElement.dataset.visibleChannels = String(document.querySelectorAll("#channelActions > .channel-button").length);
document.documentElement.dataset.events = window.__events.map(event => `${event.name}:${event.parameters.channel || ""}`).join("|");
</script>
</body>
</html>
